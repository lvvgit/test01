version: '3.8'

services:
  app:
    build:
      context: ./simple-app
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_STORE=redis
      - APP_REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  # --Storage--
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always
